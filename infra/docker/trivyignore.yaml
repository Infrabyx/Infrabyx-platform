# Trivy waivers for the platform images (IPB-01 §01.4.8.1: critical and high findings are zero or
# waived with an expiry). Each entry has a statement and an expiry at most 90 days out; an expired
# waiver fails the `containers` job again, and a waiver is removed as soon as a fixed package or a
# new base digest is available (Renovate updates the Node base by digest).
#
# All of these are in the Debian 12 packages of the pinned base node:24.22.1-bookworm-slim, with no
# fixed package in Debian 12 when waived (Trivy status affected, fix_deferred or will_not_fix). The
# app runs as UID 10001 with every capability dropped, no-new-privileges and a read-only root, and
# never runs the affected tools itself.
vulnerabilities:
  - id: CVE-2026-53613
    statement: util-linux mount TOCTOU (bsdutils, libblkid1, libmount1, libsmartcols1, libuuid1, mount, util-linux); the container never mounts and has no CAP_SYS_ADMIN. Waived 2026-10-27, no Debian 12 fix
    expired_at: 2027-01-25
  - id: CVE-2026-53615
    statement: util-linux DOS partition parser overflow (same packages); the app parses no partition tables. Waived 2026-10-27, no Debian 12 fix
    expired_at: 2027-01-25
  - id: CVE-2026-76642
    statement: util-linux X-mount post-hooks (same packages); the container never mounts. Waived 2026-10-27, no Debian 12 fix
    expired_at: 2027-01-25
  - id: CVE-2026-78408
    statement: util-linux nsenter --join-cgroup (same packages); nsenter is never run and needs capabilities the container does not have. Waived 2026-10-27, no Debian 12 fix
    expired_at: 2027-01-25
  - id: CVE-2026-78409
    statement: util-linux X-mount.subdir symlink escape (same packages); the container never mounts. Waived 2026-10-27, no Debian 12 fix
    expired_at: 2027-01-25
  - id: CVE-2026-78410
    statement: util-linux restricted bind mounts (same packages); the container never mounts. Waived 2026-10-27, no Debian 12 fix
    expired_at: 2027-01-25
  - id: CVE-2026-41992
    statement: gzip (fix deferred in Debian 12); the app never runs gzip on input. Waived 2026-10-27
    expired_at: 2027-01-25
  - id: CVE-2026-54369
    statement: libacl1 (fix deferred in Debian 12); the app sets no ACLs and the root is read-only. Waived 2026-10-27
    expired_at: 2027-01-25
  - id: CVE-2026-16742
    statement: libsystemd0 and libudev1 (fix deferred in Debian 12); no systemd or udev runs in the container. Waived 2026-10-27
    expired_at: 2027-01-25
  - id: CVE-2025-69720
    statement: ncurses (libtinfo6, ncurses-base; no Debian 12 fix); the app has no terminal UI. Waived 2026-10-27
    expired_at: 2027-01-25
  - id: CVE-2026-9538
    statement: perl-base Archive::Tar (fix deferred in Debian 12); the app runs no Perl and unpacks no tar files. Waived 2026-10-27
    expired_at: 2027-01-25
  - id: CVE-2023-45853
    statement: zlib minizip zipOpenNewFileInZip4_6 (Debian will not fix; minizip is not built into zlib1g's library API that Node uses). Waived 2026-10-27
    expired_at: 2027-01-25
  # The upstream Keycloak 26.8.1-1 base of infra/keycloak/customer-otp (UBI 9 and its jars), not the
  # extension. The rebuild pinned on 30 Oct (R1-D-35) cleared CVE-2026-114406 but not these three:
  # the OpenJDK fixes are not yet in UBI 9 ("affected", no fixed version) and Guava 33.7.2 needs a
  # later Keycloak release. Extended to 20 Nov by the owner (OWNER-QUESTIONS #93, R1-D-36), with a
  # re-scan on 6 Nov; a fixed Keycloak image is pinned once it is 7 days old (PL2-D-32).
  - id: CVE-2026-91403
    statement: OpenJDK eMudhra distrust in the Keycloak 26.8.1-1 base (UBI 9 openjdk 21.0.12.1.1, no fixed build yet); the IdP makes outbound TLS calls only to configured brokers. Waived 2026-10-29; kept on 30 Oct as the rebuild did not carry the fix; extended to 20 Nov on 2 Nov (#93)
    expired_at: 2026-11-20
  - id: CVE-2026-91415
    statement: OpenJDK font rendering in the Keycloak 26.8.1-1 base (no fixed UBI 9 build yet); Keycloak renders no untrusted fonts. Waived 2026-10-29; kept on 30 Oct as the rebuild did not carry the fix; extended to 20 Nov on 2 Nov (#93)
    expired_at: 2026-11-20
  - id: CVE-2026-102554
    statement: Guava 33.6.0 deserialisation DoS in the Keycloak 26.8.1-1 jars (fixed in 33.7.2, not yet in a Keycloak release); Keycloak deserialises no Guava data from requests. Waived 2026-10-29; kept on 30 Oct as the rebuild did not carry the fix; extended to 20 Nov on 2 Nov (#93)
    expired_at: 2026-11-20
  # Two findings in UBI 9's sqlite-libs 3.34.1-11.el9_8 in the same Keycloak 26.8.1-1 base, published
  # after 30 Oct ("affected", no fixed build). Keycloak keeps no SQLite database and never runs the
  # sqlite3 shell. Waived by the owner on 2 Nov on the terms of #93 (R1-D-36): to 20 Nov, re-scanned
  # on 6 Nov, cleared by the first fixed Keycloak image once 7 days old.
  - id: CVE-2026-119373
    statement: SQLite FTS5 heap overflow in UBI 9 sqlite-libs of the Keycloak 26.8.1-1 base (no fixed build); Keycloak opens no SQLite database and builds no FTS5 index. Waived 2026-11-02 by the owner (R1-D-36)
    expired_at: 2026-11-20
  - id: CVE-2026-119586
    statement: sqlite3 shell `.recover` command execution in UBI 9 sqlite-libs of the Keycloak 26.8.1-1 base (no fixed build); the image never runs the sqlite3 shell. Waived 2026-11-02 by the owner (R1-D-36)
    expired_at: 2026-11-20
  - id: CVE-2026-109518
    statement: apt and libapt-pkg6.0 2.6.1, an on-path attacker during apt's own downloads (fixed in Debian 12 as 2.6.2, which no node:24.22.1-bookworm-slim digest carries yet; the newest, built 2026-10-28, still has 2.6.1). The runtime never runs apt, fetches no packages, runs as UID 10001 with a read-only root and no capabilities. Waived 2026-11-05 under the standing 30-day rule (R1-D-99); removed with the first base digest carrying 2.6.2 once it is 7 days old
    expired_at: 2026-12-05
  - id: CVE-2026-76844
    statement: zlib1g 1:1.2.13.dfsg-1 in the Debian 12 base (Trivy status affected, no fixed version; Trivy's record titles it after webpack-dev-middleware, which looks misattributed and is re-checked when its database updates). Node.js uses its own bundled zlib, not the system library; the runtime decompresses no untrusted archives with system tools, runs as UID 10001 with a read-only root and no capabilities. Waived 2026-11-05 under the standing 30-day rule (R1-D-106); removed with the first fixed package or corrected advisory
    expired_at: 2026-12-05
