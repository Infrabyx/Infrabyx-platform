{{- include "infrabyx-app.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infrabyx-app.name" . }}
  labels:
    {{- include "infrabyx-app.labels" . | nindent 4 }}
spec:
  {{- if not (or .Values.autoscaling.enabled .Values.autoscaling.keda.enabled) }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "infrabyx-app.selector" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {{- include "infrabyx-app.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "infrabyx-app.name" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "infrabyx-app.podSecurity" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "infrabyx-app.selector" . | nindent 14 }}
      containers:
        - name: {{ .Values.app.kind }}
          image: {{ include "infrabyx-app.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.app.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
              protocol: TCP
          env:
            {{- include "infrabyx-app.env" . | nindent 12 }}
          securityContext:
            {{- include "infrabyx-app.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: {{ .Values.probes.startup }}, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: {{ .Values.probes.ready }}, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: {{ .Values.probes.live }}, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            {{- include "infrabyx-app.mounts" . | nindent 12 }}
      volumes:
        {{- include "infrabyx-app.volumes" . | nindent 8 }}
