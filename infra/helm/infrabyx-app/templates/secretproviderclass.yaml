{{- if .Values.secrets.provider }}
{{- $providers := dict "aws-secrets-manager" "aws" "vault" "vault" "azure-keyvault" "azure" "gcp-secret-manager" "gcp" }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "infrabyx-app.name" . }}
  labels:
    {{- include "infrabyx-app.labels" . | nindent 4 }}
spec:
  provider: {{ get $providers .Values.secrets.provider }}
  {{- with .Values.secrets.parameters }}
  parameters:
    {{- range $k, $v := . }}
    {{ $k }}: {{ $v | toString | quote }}
    {{- end }}
  {{- end }}
{{- end }}
