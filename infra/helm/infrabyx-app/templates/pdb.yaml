apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "infrabyx-app.name" . }}
  labels:
    {{- include "infrabyx-app.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "infrabyx-app.selector" . | nindent 6 }}
