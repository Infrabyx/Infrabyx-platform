# Images are signed with Sigstore cosign (keyless, GitHub OIDC) and carry a CycloneDX SBOM
# attestation (IPB-01-35, IPB-02-35). Enforced by default (owner answer #67, PL6-D-16): a pod is
# refused unless its namespace is labelled as an environment below staging
# (`infrabyx.dev/env` = local, dev, test or preview), where the same check only audits. Staging,
# demo, pre-prod, prod, dr and an unlabelled namespace are enforced. Label namespaces when the
# cluster is bootstrapped; pods cannot choose their own namespace's labels.
# Matches only the platform's own registry path and release workflow; products add theirs
# (docs/product-guide.md §5).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-images
  annotations:
    policies.kyverno.io/title: Signed and attested images
spec:
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: signed-and-attested
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaceSelector:
                matchExpressions:
                  - key: infrabyx.dev/env
                    operator: In
                    values: [local, dev, test, preview]
      verifyImages:
        - imageReferences: ["ghcr.io/infrabyx/*"]
          failureAction: Enforce
          # The chart and disallow-latest-tag already require digests; nothing is rewritten.
          mutateDigest: false
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subjectRegExp: "^https://github\\.com/Infrabyx/[^/]+/\\.github/workflows/release\\.yml@refs/heads/main$"
                    rekor:
                      url: https://rekor.sigstore.dev
          attestations:
            - type: https://cyclonedx.org/bom
              attestors:
                - entries:
                    - keyless:
                        issuer: https://token.actions.githubusercontent.com
                        subjectRegExp: "^https://github\\.com/Infrabyx/[^/]+/\\.github/workflows/release\\.yml@refs/heads/main$"
                        rekor:
                          url: https://rekor.sigstore.dev
    - name: signed-and-attested-below-staging
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchExpressions:
                  - key: infrabyx.dev/env
                    operator: In
                    values: [local, dev, test, preview]
      verifyImages:
        - imageReferences: ["ghcr.io/infrabyx/*"]
          failureAction: Audit
          mutateDigest: false
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subjectRegExp: "^https://github\\.com/Infrabyx/[^/]+/\\.github/workflows/release\\.yml@refs/heads/main$"
                    rekor:
                      url: https://rekor.sigstore.dev
          attestations:
            - type: https://cyclonedx.org/bom
              attestors:
                - entries:
                    - keyless:
                        issuer: https://token.actions.githubusercontent.com
                        subjectRegExp: "^https://github\\.com/Infrabyx/[^/]+/\\.github/workflows/release\\.yml@refs/heads/main$"
                        rekor:
                          url: https://rekor.sigstore.dev
