name: registry-dist
# Prints the registry's own `dist` (shasum, integrity, tarball) for published versions, so a gate
# report can be checked against GitHub Packages (OWNER-QUESTIONS #17, PL3-D-03). Manual only; reads,
# never publishes.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated name@version list"
        required: false
        default: "@infrabyx/contracts@0.2.0 @infrabyx/crypto@0.2.0 @infrabyx/config@0.2.0 @infrabyx/tenancy@0.2.0 @infrabyx/audit@0.1.1 @infrabyx/seed@0.2.0 @infrabyx/testing@0.2.0 @infrabyx/connectors@0.1.0"
      compare_ref:
        description: "Optional commit to rebuild and pack; each tarball is diffed against the registry's"
        required: false
        default: ""
permissions:
  contents: read
  packages: read
jobs:
  dist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: inputs.compare_ref != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@infrabyx"
      - name: npm view <name>@<version> dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.NPM_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          for p in $PACKAGES; do
            echo "== $p"
            npm view "$p" dist --registry https://npm.pkg.github.com
          done
          node -e 'console.log(JSON.stringify(process.env.PACKAGES.trim().split(/\s+/).map((s) => { const i = s.lastIndexOf("@"); return { name: s.slice(0, i), version: s.slice(i + 1) }; })))' > /tmp/published.json
          PUBLISHED="$(cat /tmp/published.json)" node scripts/registry-dist.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Reproducibility diff (rebuild at compare_ref, pack, diff against the registry tarball)
        if: inputs.compare_ref != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.NPM_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
          PACKAGES: ${{ inputs.packages }}
          COMPARE_REF: ${{ inputs.compare_ref }}
        run: |
          git worktree add /tmp/rd/src "$COMPARE_REF"
          cd /tmp/rd/src
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p /tmp/rd/local /tmp/rd/registry
          for p in $PACKAGES; do
            name="${p%@*}"; dir="/tmp/rd/src/packages/${name#@infrabyx/}"
            (cd "$dir" && pnpm pack --pack-destination /tmp/rd/local >/dev/null)
            (cd /tmp/rd/registry && npm pack "$p" --registry https://npm.pkg.github.com >/dev/null)
          done
          for t in /tmp/rd/local/*.tgz; do
            f="$(basename "$t")"
            echo "== $f local $(sha1sum < "$t" | cut -c1-40) registry $(sha1sum < "/tmp/rd/registry/$f" | cut -c1-40)"
            if ! cmp -s "$t" "/tmp/rd/registry/$f"; then
              mkdir -p "/tmp/rd/x/l/$f" "/tmp/rd/x/r/$f"
              tar -xzf "$t" -C "/tmp/rd/x/l/$f"; tar -xzf "/tmp/rd/registry/$f" -C "/tmp/rd/x/r/$f"
              diff <(tar -tvzf "$t" | awk '{print $1, $3, $6}' | sort -k3) \
                   <(tar -tvzf "/tmp/rd/registry/$f" | awk '{print $1, $3, $6}' | sort -k3) || true
              diff -r "/tmp/rd/x/l/$f" "/tmp/rd/x/r/$f" | head -60 || true
            fi
          done
