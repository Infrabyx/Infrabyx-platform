name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
jobs:
  verify:
    # IPB-09-07 required checks land here as packages do. PL0 provides: pin-check, lint
    # (ESLint + Prettier + IPB rules vendor-import / schema-boundary / no-process-env),
    # typecheck, build, unit, ipb-check, spec-readonly.
    # Still to add: contract, e2e, a11y, rls-lint, migration-lint, sbom, semgrep, zap-baseline,
    # licence, bundle-budget, lighthouse, export-map-gate, golden-archive-diff, secret-scan,
    # pr-checklist, commitlint, changeset-required.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Single entry on purpose (IPB-01-01); a second entry only during an ADR-approved window.
        node: ["24.22.1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        # version comes from package.json#packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@infrabyx"
      - name: pin-check (IPB-01-01, IPB-D-01)
        run: |
          test "$(cat .nvmrc)" = "${{ matrix.node }}"
          node -v | grep -qx "v${{ matrix.node }}"
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: spec-readonly (docs/ipb and docs/ecosystem are never edited here)
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- docs/ipb docs/ecosystem)"
          if [ -n "$changed" ]; then
            echo "::error::Spec of record modified in this PR (write a request to docs/platform-requests.md instead):"
            echo "$changed"
            exit 1
          fi
      - name: lint (ESLint + IPB rules)
        run: pnpm lint
      - name: lint (Prettier)
        run: pnpm format:check
      - name: typecheck
        run: pnpm typecheck
      - name: build
        run: pnpm build
      - name: unit
        run: pnpm test
      - name: policy-rules (vendor-import, schema-boundary, no-process-env rule tests)
        run: pnpm test:policy
      - name: ipb-check (structural checks)
        run: pnpm ipb:check
      - name: changeset status
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since="origin/${{ github.base_ref }}"
