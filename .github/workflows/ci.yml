name: ci
on:
  pull_request:
    # labeled/unlabeled: the export:unchanged and no-changeset labels change what passes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
# A newer push to a PR cancels its older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  # Git hooks are a local guard (PL1-D-17); CI enforces the same checks as steps.
  LEFTHOOK: "0"
jobs:
  changes:
    # Docs-only PRs (docs/** and Markdown files) skip the heavy legs; `verify` always runs.
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ] &&
            ! git diff --name-only "origin/$BASE_REF...HEAD" | grep -qvE '^docs/|\.md$'; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changes: $code"
  verify:
    # IPB-09-07 required checks land here as packages do. PL0 provides: pin-check, secret-scan,
    # spec-readonly, lint (ESLint + Prettier + IPB rules vendor-import / schema-boundary /
    # no-process-env), typecheck, build, unit, policy-rules, licence, ipb-check, commitlint,
    # changeset-required, pr-checklist.
    # PL1 adds: migration-lint, registry-check, dev-keys-check, env-example-check (here) and
    # rls-lint, integration, at-report (job `integration`, PostgreSQL 18 service).
    # PL2 adds routing-check here and the port-contract workflow (port-contract.yml).
    # PL3 adds notify-lint and export-map-gate here and golden-archive-diff in `integration`.
    # PL4 adds ai-prompt-lint and ai-eval-gate here, and runs `integration` on PostgreSQL 18 with
    # pgvector.
    # PL5 adds hlp-lint and journeys-lint here and the `a11y` job (the group site's gate).
    # Still to add: sbom, semgrep, zap-baseline, bundle-budget, lighthouse,
    # change-class.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Single entry on purpose (IPB-01-01); a second entry only during an ADR-approved window.
        node: ["24.22.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        # version comes from package.json#packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@infrabyx"
      - name: pin-check (IPB-01-01, IPB-D-01)
        run: |
          test "$(cat .nvmrc)" = "${{ matrix.node }}"
          node -v | grep -qx "v${{ matrix.node }}"
      - name: secret-scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          BASE_REF: ${{ github.base_ref }}
        run: |
          curl -sSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          if [ -n "$BASE_REF" ]; then
            /tmp/gitleaks git --redact --no-banner --exit-code 1 --log-opts="origin/${BASE_REF}..HEAD" .
          else
            /tmp/gitleaks git --redact --no-banner --exit-code 1 .
          fi
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: spec-readonly (docs/ipb and docs/ecosystem are never edited here)
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- docs/ipb docs/ecosystem)"
          if [ -n "$changed" ]; then
            echo "::error::Spec of record modified in this PR (write a request to docs/platform-requests.md instead):"
            echo "$changed"
            exit 1
          fi
      - name: commitlint (IPB-09-19)
        if: github.event_name == 'pull_request'
        run: pnpm commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose
      - name: lint (ESLint + IPB rules)
        run: pnpm lint
      - name: lint (Prettier)
        run: pnpm format:check
      - name: typecheck
        run: pnpm typecheck
      - name: build
        run: pnpm build
      - name: unit
        run: pnpm test
      - name: policy-rules (vendor-import, schema-boundary, no-process-env rule tests)
        run: pnpm test:policy
      - name: licence (allow-list)
        run: pnpm licence:check
      - name: ipb-check (structural checks)
        run: pnpm ipb:check
      - name: migration-lint (IPB-09-31; every rule of §09.4.6.2 and forbidden operation of §09.4.6.3)
        run: pnpm migration:lint
      - name: registry-check (settings-tree.yaml → registry.generated.ts, IPB-07)
        run: pnpm registry:check
      - name: routing-check (IPB-01-20; provider_routing files, IPB-DEV-04 gate B)
        run: pnpm routing:check
      - name: notify-lint (PL3 plan §6.2; notification catalogue)
        run: pnpm notify:lint
      - name: hlp-lint (IPB-07-43, @IPB-07-AT-02; every help key in the platform registry)
        run: pnpm hlp:lint
      - name: journeys-lint (IPB-06-15, 06-58; journey registry and AT scripts of the group site)
        run: pnpm journeys:lint
      - name: ai-prompt-lint (IPB-03-25, 03-40; golden set per prompt, no inline prompt text)
        run: pnpm ai:prompt-lint
      - name: ai-eval-gate (IPB-03-41; golden sets on the scripted fake model, baseline and committed results)
        run: pnpm ai:eval-gate
      - name: export-map-gate (IPB-09-34, @IPB-09-AT-14; IPB-ENG-006)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          UNCHANGED: ${{ contains(github.event.pull_request.labels.*.name, 'export:unchanged') }}
        run: |
          node packages/export/dist/cli.js map-gate --base "origin/$BASE_REF" \
            $([ "$UNCHANGED" = "true" ] && echo --unchanged-label)
      - name: dev-keys-check (dev-keys.json fingerprints, PL1-C-10)
        run: pnpm dev-keys:check
      - name: env-example-check (IPB-11-03, @IPB-11-AT-06; seed schema fixture)
        run: pnpm env:example:check
      - name: changeset-required (IPB-09-20)
        # The Changesets version PR consumes changesets and carries the generated body (PL1-D-21).
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changeset') && !(github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository)
        run: pnpm changeset status --since="origin/${{ github.base_ref }}"
      - name: pr-checklist (IPB-09-03/04)
        if: github.event_name == 'pull_request' && !(github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: pnpm pr:checklist
  consumer-smoke:
    # Installs the packed tarballs in a clean directory with plain npm and imports every JavaScript
    # export with plain Node 24.22.1, as a product does (PL3-D-02). Catches CommonJS named-import
    # mismatches and missing files that the workspace and vitest hide.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@infrabyx"
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: build
        run: pnpm build
      - name: consumer-smoke (pack, clean install, import every export)
        run: node scripts/consumer-smoke.mjs
  integration:
    # IPB-01 §01.4.10: integration tests run against real PostgreSQL 18 (IPB-D-02), with pgvector for
    # AI retrieval (PL4 plan §4.9; image pinned by digest, PL4 spike §4).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg18@sha256:508c5290cda481d4f5f846446a26e9c1b804766828a394a5861de1b348a18b4c
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      IPB_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@infrabyx"
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: build
        run: pnpm build
      - name: migrate (infrabyx-migrate applies tenancy → audit → config → seed → connectors → rules → workflow → notify → export → ai → vidhi → brand → cms, checksums in meta.migration_checksums)
        run: node packages/tenancy/dist/migrate/cli.js --db "$IPB_TEST_PG_URL"
      - name: rls-lint (IPB-02-12; every tenant table enabled + forced + tenant policy, no BYPASSRLS)
        run: node packages/tenancy/dist/rls-lint/cli.js --db "$IPB_TEST_PG_URL"
      - name: golden-archive-diff (IPB-09-35, @IPB-09-AT-15; IPB-ENG-007)
        run: pnpm --filter @infrabyx/export test:golden
      - name: integration (test:int; @NN-01/02/45/18 and the @IPB-..-AT-.. database scenarios)
        run: pnpm test:int
      - name: at-report (acceptance-test coverage; report only)
        run: pnpm at:report
  a11y:
    # The group site's gate (PL5 plan §11, §15; IPB-06-54, IPB-04-71): build, migrate and seed the
    # site on PostgreSQL 18, check the footer of every published pack and the served routes against
    # the journey registry, scan the build for overlay widgets, then run the end-to-end suite in
    # Chromium (axe and HTML_CodeSniffer in light and dark themes, reflow, text scale, skip link,
    # no third-party request before or after consent, content without JavaScript, CSP); then the
    # same gate over every Studio route of `apps/console` (PL5 plan §9.6).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg18@sha256:508c5290cda481d4f5f846446a26e9c1b804766828a394a5861de1b348a18b4c
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Synthetic data only: the test profile with fixture adapters (refused from staging upwards).
      APP_ENV: test
      APP_PRODUCT: OH
      APP_BASE_URL: https://group.example.org
      APP_FIXTURE_ADAPTERS: "true"
      DB_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DB_PASSWORD: postgres
      STORAGE_DIR: ${{ github.workspace }}/.site-storage
      NEXT_TELEMETRY_DISABLED: "1"
      IPB_TEST_SITE_URL: http://127.0.0.1:3123
      IPB_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@infrabyx"
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: build
        run: pnpm build
      - name: migrate
        run: node packages/tenancy/dist/migrate/cli.js --db "$DB_URL"
      - name: seed (test profile; the platform and public-site modules)
        working-directory: apps/public
        env:
          SEED_ENABLED: "true"
          SEED_RANDOM_SEED: "1"
          SEED_VAULT_PREFIX: test
          # Written outside the workspace and never uploaded (SEED_CREDENTIALS.md is never committed).
          SEED_CREDENTIALS_PATH: ${{ runner.temp }}/seed-credentials.md
        run: node ../../packages/seed/dist/cli.js --profile test --modules src/seed/public-site.ts
      - name: gate inputs (footer of every published pack, served routes)
        working-directory: apps/public
        run: node scripts/gate-inputs.ts "$RUNNER_TEMP/gate"
      - name: validate-footer (IPB-04-71, @IPB-04-AT-73)
        run: node packages/cms/dist/cli.js validate-footer "$RUNNER_TEMP/gate/footer.json"
      - name: journeys-lint against the served routes (IPB-06-58)
        run: >-
          node packages/a11y/dist/cli.js journeys-lint apps/public/journeys/GRP.yaml
          --routes "$RUNNER_TEMP/gate/routes.json" --at-scripts apps/public/at-scripts
      - name: overlay-scan (IPB-06-17; no accessibility overlay in the build)
        run: >-
          node packages/a11y/dist/cli.js overlay-scan apps/public/.next/static apps/public/src
          apps/console/.next/static apps/console/src
      - name: start the site
        working-directory: apps/public
        run: |
          PORT=3123 nohup pnpm start > "$RUNNER_TEMP/site.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3123/robots.txt && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/site.log"
          exit 1
      - name: e2e and accessibility gate (@IPB-06-AT-01 @IPB-04-AT-70/74/80/81/85 @IPB-04-AT-12/40)
        run: pnpm --filter @infrabyx/public-site test:e2e
      - name: start the Studio console
        working-directory: apps/console
        env:
          APP_BASE_URL: https://studio.example.org
          APP_SITE_URL: https://group.example.org
        run: |
          PORT=3124 nohup pnpm start > "$RUNNER_TEMP/console.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3124/sign-in && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/console.log"
          exit 1
      - name: Studio console gate (every Studio route; the AUTHZ gate; maker-checker through the forms)
        env:
          IPB_TEST_CONSOLE_URL: http://127.0.0.1:3124
        run: pnpm --filter @infrabyx/console test:e2e
      - name: site and console logs
        if: failure()
        run: cat "$RUNNER_TEMP/site.log" "$RUNNER_TEMP/console.log" || true
