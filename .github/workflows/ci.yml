name: ci
on:
  pull_request:
    # labeled/unlabeled: the export:unchanged and no-changeset labels change what passes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
# A newer push to a PR cancels its older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  # Git hooks are a local guard (PL1-D-17); CI enforces the same checks as steps.
  LEFTHOOK: "0"
jobs:
  changes:
    # Docs-only PRs (docs/** and Markdown files) skip the heavy legs; `verify` always runs.
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ] &&
            ! git diff --name-only "origin/$BASE_REF...HEAD" | grep -qvE '^docs/|\.md$'; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changes: $code"
  verify:
    # IPB-09-07 required checks land here as packages do. PL0 provides: pin-check, secret-scan,
    # spec-readonly, lint (ESLint + Prettier + IPB rules vendor-import / schema-boundary /
    # no-process-env), typecheck, build, unit, policy-rules, licence, ipb-check, commitlint,
    # changeset-required, pr-checklist.
    # PL1 adds: migration-lint, registry-check, dev-keys-check, env-example-check (here) and
    # rls-lint, integration, at-report (job `integration`, PostgreSQL 18 service).
    # PL2 adds routing-check here and the port-contract workflow (port-contract.yml).
    # PL3 adds notify-lint and export-map-gate here and golden-archive-diff in `integration`.
    # PL4 adds ai-prompt-lint and ai-eval-gate here, and runs `integration` on PostgreSQL 18 with
    # pgvector.
    # PL5 adds hlp-lint and journeys-lint here and the `a11y` job (the group site's gate).
    # Still to add: sbom, semgrep, zap-baseline, bundle-budget, lighthouse,
    # change-class.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Single entry on purpose (IPB-01-01); a second entry only during an ADR-approved window.
        node: ["24.22.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        # version comes from package.json#packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@infrabyx"
      - name: pin-check (IPB-01-01, IPB-D-01)
        run: |
          test "$(cat .nvmrc)" = "${{ matrix.node }}"
          node -v | grep -qx "v${{ matrix.node }}"
      - name: secret-scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          BASE_REF: ${{ github.base_ref }}
        run: |
          curl -sSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          if [ -n "$BASE_REF" ]; then
            /tmp/gitleaks git --redact --no-banner --exit-code 1 --log-opts="origin/${BASE_REF}..HEAD" .
          else
            /tmp/gitleaks git --redact --no-banner --exit-code 1 .
          fi
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: spec-readonly (docs/ipb and docs/ecosystem are never edited here)
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- docs/ipb docs/ecosystem)"
          if [ -n "$changed" ]; then
            echo "::error::Spec of record modified in this PR (write a request to docs/platform-requests.md instead):"
            echo "$changed"
            exit 1
          fi
      - name: commitlint (IPB-09-19)
        if: github.event_name == 'pull_request'
        run: pnpm commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose
      - name: lint (ESLint + IPB rules)
        run: pnpm lint
      - name: lint (Prettier)
        run: pnpm format:check
      - name: typecheck
        run: pnpm typecheck
      - name: build
        run: pnpm build
      - name: unit
        run: pnpm test
      - name: policy-rules (vendor-import, schema-boundary, no-process-env rule tests)
        run: pnpm test:policy
      - name: licence (allow-list)
        run: pnpm licence:check
      - name: ipb-check (structural checks)
        run: pnpm ipb:check
      - name: migration-lint (IPB-09-31; every rule of §09.4.6.2 and forbidden operation of §09.4.6.3)
        run: pnpm migration:lint
      - name: registry-check (settings-tree.yaml → registry.generated.ts, IPB-07)
        run: pnpm registry:check
      - name: routing-check (IPB-01-20; provider_routing files, IPB-DEV-04 gate B)
        run: pnpm routing:check
      - name: notify-lint (PL3 plan §6.2; notification catalogue)
        run: pnpm notify:lint
      - name: hlp-lint (IPB-07-43, @IPB-07-AT-02; every help key in the platform registry)
        run: pnpm hlp:lint
      - name: journeys-lint (IPB-06-15, 06-58; journey registry and AT scripts of the group site)
        run: pnpm journeys:lint
      - name: ai-prompt-lint (IPB-03-25, 03-40; golden set per prompt, no inline prompt text)
        run: pnpm ai:prompt-lint
      - name: ai-eval-gate (IPB-03-41; golden sets on the scripted fake model, baseline and committed results)
        run: pnpm ai:eval-gate
      - name: export-map-gate (IPB-09-34, @IPB-09-AT-14; IPB-ENG-006)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          UNCHANGED: ${{ contains(github.event.pull_request.labels.*.name, 'export:unchanged') }}
        run: |
          node packages/export/dist/cli.js map-gate --base "origin/$BASE_REF" \
            $([ "$UNCHANGED" = "true" ] && echo --unchanged-label)
      - name: dev-keys-check (dev-keys.json fingerprints, PL1-C-10)
        run: pnpm dev-keys:check
      - name: env-example-check (IPB-11-03, @IPB-11-AT-06; seed schema fixture)
        run: pnpm env:example:check
      - name: changeset-required (IPB-09-20)
        # The Changesets version PR consumes changesets and carries the generated body (PL1-D-21).
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changeset') && !(github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository)
        run: pnpm changeset status --since="origin/${{ github.base_ref }}"
      - name: pr-checklist (IPB-09-03/04)
        if: github.event_name == 'pull_request' && !(github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: pnpm pr:checklist
  containers:
    # Every deployable image (IPB-01-31, PL6 plan §3.3): hadolint and `trivy config` on the
    # Dockerfiles, build each image, `trivy image` (critical and high must be zero or waived with an
    # expiry in infra/docker/trivyignore.yaml), then the hardening test (@IPB-01-AT-15): UID 10001,
    # HEALTHCHECK, read-only root, health probes, ready failing closed. Images are never pushed
    # (OWNER-QUESTIONS #67). Tools run from Docker Hub images pinned by digest (infra/docker/README.md).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
      TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
      # Next.js images: <app folder under apps/>, built with infra/docker/next/Dockerfile.
      APPS: public console reference/web
      # Node (non-Next.js) images: <app folder under apps/>, built with infra/docker/node/Dockerfile.
      NODE_APPS: reference/api reference/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hadolint
        run: |
          for f in $(git ls-files '*Dockerfile'); do
            echo "== $f"
            docker run --rm -i "$HADOLINT_IMAGE" hadolint - < "$f"
          done
      - name: trivy config (Dockerfiles)
        run: >-
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/trivy:/root/.cache/trivy"
          "$TRIVY_IMAGE" config --exit-code 1 --severity HIGH,CRITICAL /src/infra/docker
      - name: build images
        run: |
          for app in $APPS; do
            docker build -f infra/docker/next/Dockerfile --build-arg APP="$app" \
              -t "infrabyx/${app//\//-}:ci-${GITHUB_SHA::12}" .
          done
          for app in $NODE_APPS; do
            docker build -f infra/docker/node/Dockerfile --build-arg APP="$app" \
              -t "infrabyx/${app//\//-}:ci-${GITHUB_SHA::12}" .
          done
      - name: trivy image
        run: |
          for app in ${APPS//\//-} ${NODE_APPS//\//-}; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/infra/docker:/cfg:ro" \
              -v "$RUNNER_TEMP/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" image --exit-code 1 \
              --severity HIGH,CRITICAL --ignorefile /cfg/trivyignore.yaml --scanners vuln,secret \
              "infrabyx/$app:ci-${GITHUB_SHA::12}"
          done
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: hardening test (@IPB-01-AT-15)
        run: |
          IPB_IMAGES="$(for app in ${APPS//\//-} ${NODE_APPS//\//-}; do printf 'infrabyx/%s:ci-%s ' "$app" "${GITHUB_SHA::12}"; done)" \
            pnpm images:test
  compose:
    # The local stack (IPB-01-33, PL6 plan §4): `pnpm dev:up` starts the `core` profile, waits for
    # every health check, migrates and seeds; then the seeded site is checked through the `apps`
    # profile images, and `pnpm dev:down` removes everything. Generated local secrets only.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
      - name: dev:up (core and apps profiles)
        run: pnpm dev:up --profile apps
      - name: the seeded site, console, reference API, worker and web answer through their images
        run: |
          # The reference api and worker run on the stack's real Keycloak, Cerbos, MinIO and Redis:
          # `ready` is `up` only when every one of them answers (the buckets with Object Lock, the
          # realm, the policies, the queue); the web is `up` when the api answers.
          for port in 53123 53124 53125 53126 53127; do
            curl -fsS "http://127.0.0.1:$port/health/ready" | grep -q '"status":"up"'
          done
          # Sign-in goes to the Keycloak realm dev:up applied, through the web origin (PL6-D-12); a
          # bare request to the api is refused as a problem.
          curl -sS -o /dev/null -w '%{redirect_url}\n' http://localhost:53127/auth/login | grep -q '/realms/infrabyx-local/.*redirect_uri=http%3A%2F%2Flocalhost%3A53127%2Fauth%2Fcallback'
          curl -sS http://localhost:53125/hello/greetings | grep -q '"IPB-API-401"'
          curl -fsS http://localhost:53125/trust | grep -q '"documents"'
          # The seed personas exist in the realm (the credentials file is never committed).
          test -s SEED_CREDENTIALS.md
          curl -fsS -o /dev/null http://127.0.0.1:53123/
          curl -fsS http://127.0.0.1:53123/legal/index.json | grep -q '"policies"'
      - name: logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env.local --profile core --profile apps logs --tail 80 || true
      - name: dev:down
        if: always()
        run: pnpm dev:down
  reference:
    # The reference application's gate (PL6 plan §8.2, IPB-14 §14.5 items 2 and 4): the Compose stack
    # with the reference api, worker and web on the real Keycloak, Cerbos, MinIO, Redis and Temporal;
    # the gate journey in Chromium (a seeded owner signs in through Keycloak and enrols TOTP, reads a
    # CMS page, asks the assistant, downloads the signed export, opens the Trust Centre; axe on every
    # page); then the api's integration and NN suites on the stack's PostgreSQL 18 and Temporal.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      IPB_CHROMIUM: /usr/bin/google-chrome
      IPB_TEST_WEB_URL: http://localhost:53127
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
      - name: dev:up (core and apps profiles)
        run: pnpm dev:up --profile apps
      - name: the gate journey (Playwright, axe on every page)
        env:
          IPB_TEST_CREDENTIALS: ${{ github.workspace }}/SEED_CREDENTIALS.md
        run: pnpm --filter @infrabyx/reference-web test:e2e
      - name: the api's integration and NN suites on the stack's PostgreSQL and Temporal
        run: |
          # Each suite migrates a fresh database of its own on the stack's server; the stack's own
          # database is not touched. The Temporal test uses a task queue of its own.
          POSTGRES_PASSWORD="$(grep '^POSTGRES_PASSWORD=' infra/compose/.env.local | cut -d= -f2-)"
          IPB_TEST_PG_URL="postgres://postgres:${POSTGRES_PASSWORD}@127.0.0.1:55432/postgres" \
          IPB_TEST_TEMPORAL_URL="http://127.0.0.1:57233" \
            pnpm --filter @infrabyx/reference-api test:int
      - name: logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env.local --profile core --profile apps logs --tail 120 || true
      - name: dev:down
        if: always()
        run: pnpm dev:down
  infra:
    # The shared Helm chart and the admission policies (IPB-01-32, IPB-01-35; PL6 plan §5, §6):
    # helm lint and the render tests (@IPB-01-AT-12, Helm scenario), kubeconform against pinned
    # schemas, `trivy config` on the chart, `kyverno test` on the policies, then `kyverno apply` of
    # every policy over every rendered CI values file. Tools from pinned versions only
    # (scripts/ci/infra-tools.sh), cached between runs.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
      INFRA_TOOLS: ${{ github.workspace }}/.infra-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tools-cache
        with:
          path: .infra-tools
          key: infra-tools-${{ hashFiles('scripts/ci/infra-tools.sh', 'infra/terraform/**/versions.tf') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.tools-cache.outputs.cache-hit != 'true'
        with:
          go-version: "1.24"
          cache: false
      - name: tools (Helm, kubeconform, Kyverno CLI, OpenTofu, tflint)
        run: |
          scripts/ci/infra-tools.sh
          echo "$INFRA_TOOLS" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: helm lint and render tests (@IPB-01-AT-12)
        run: pnpm infra:test
      - name: kubeconform
        run: infra/helm/infrabyx-app/tests/kubeconform.sh
      - name: trivy config (chart)
        run: >-
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" config --exit-code 1
          --severity HIGH,CRITICAL --helm-values /src/infra/helm/infrabyx-app/ci/api-prod-values.yaml
          /src/infra/helm/infrabyx-app
      - name: kyverno test
        run: kyverno test infra/policy/kyverno/tests
      - name: tofu fmt, init and validate (every module and the example stack)
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.infra-tools/tofu-plugins
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          tofu fmt -check -recursive -diff infra/terraform
          for dir in infra/terraform/modules/*/* infra/terraform/envs/example/*; do
            [ -n "$(ls "$dir"/*.tf 2>/dev/null)" ] || continue
            echo "== $dir"
            tofu -chdir="$dir" init -backend=false -input=false -no-color > /dev/null
            tofu -chdir="$dir" validate -no-color
          done
      - name: tofu test (@IPB-01-AT-14, output contract with mock providers)
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.infra-tools/tofu-plugins
        run: |
          for dir in infra/terraform/modules/*/platform; do
            echo "== $dir"
            tofu -chdir="$dir" test -no-color
          done
      - name: tflint (the Terraform recommended preset and the AWS, Azure and Google rulesets)
        working-directory: infra/terraform
        env:
          TFLINT_PLUGIN_DIR: ${{ github.workspace }}/.infra-tools/tflint-plugins
        run: tflint --recursive --config "$PWD/.tflint.hcl" --format compact
      - name: trivy config (OpenTofu)
        run: >-
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" config --exit-code 1
          --severity HIGH,CRITICAL /src/infra/terraform
      - name: kyverno apply over the pods the rendered chart creates
        # Every policy over every pod; the step fails unless rules ran, all passed and none failed.
        run: |
          for values in infra/helm/infrabyx-app/ci/*.yaml; do
            echo "== $values"
            helm template r infra/helm/infrabyx-app -f "$values" |
              node infra/helm/infrabyx-app/tests/pods-from-render.mjs > "$RUNNER_TEMP/pods.yaml"
            kyverno apply infra/policy/kyverno/*.yaml --resource "$RUNNER_TEMP/pods.yaml" |
              tee "$RUNNER_TEMP/apply.txt"
            grep -Eq '^pass: [1-9][0-9]*, fail: 0, warn: 0, error: 0' "$RUNNER_TEMP/apply.txt"
          done
  consumer-smoke:
    # Installs the packed tarballs in a clean directory with plain npm and imports every JavaScript
    # export with plain Node 24.22.1, as a product does (PL3-D-02). Catches CommonJS named-import
    # mismatches and missing files that the workspace and vitest hide.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@infrabyx"
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: build
        run: pnpm build
      - name: consumer-smoke (pack, clean install, import every export)
        run: node scripts/consumer-smoke.mjs
  integration:
    # IPB-01 §01.4.10: integration tests run against real PostgreSQL 18 (IPB-D-02), with pgvector for
    # AI retrieval (PL4 plan §4.9; image pinned by digest, PL4 spike §4).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg18@sha256:508c5290cda481d4f5f846446a26e9c1b804766828a394a5861de1b348a18b4c
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      IPB_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@infrabyx"
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: build
        run: pnpm build
      - name: migrate (infrabyx-migrate applies tenancy → audit → config → seed → connectors → rules → workflow → notify → export → ai → vidhi → brand → cms, checksums in meta.migration_checksums)
        run: node packages/tenancy/dist/migrate/cli.js --db "$IPB_TEST_PG_URL"
      - name: rls-lint (IPB-02-12; every tenant table enabled + forced + tenant policy, no BYPASSRLS)
        run: node packages/tenancy/dist/rls-lint/cli.js --db "$IPB_TEST_PG_URL"
      - name: golden-archive-diff (IPB-09-35, @IPB-09-AT-15; IPB-ENG-007)
        run: pnpm --filter @infrabyx/export test:golden
      - name: integration (test:int; @NN-01/02/45/18 and the @IPB-..-AT-.. database scenarios)
        run: pnpm test:int
      - name: at-report (acceptance-test coverage; report only)
        run: pnpm at:report
  a11y:
    # The group site's gate (PL5 plan §11, §15; IPB-06-54, IPB-04-71): build, migrate and seed the
    # site on PostgreSQL 18, check the footer of every published pack and the served routes against
    # the journey registry, scan the build for overlay widgets, then run the end-to-end suite in
    # Chromium (axe and HTML_CodeSniffer in light and dark themes, reflow, text scale, skip link,
    # no third-party request before or after consent, content without JavaScript, CSP); then the
    # same gate over every Studio route of `apps/console` (PL5 plan §9.6).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg18@sha256:508c5290cda481d4f5f846446a26e9c1b804766828a394a5861de1b348a18b4c
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Synthetic data only: the test profile with fixture adapters (refused from staging upwards).
      APP_ENV: test
      APP_PRODUCT: OH
      APP_BASE_URL: https://group.example.org
      APP_FIXTURE_ADAPTERS: "true"
      DB_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DB_PASSWORD: postgres
      STORAGE_DIR: ${{ github.workspace }}/.site-storage
      NEXT_TELEMETRY_DISABLED: "1"
      IPB_TEST_SITE_URL: http://127.0.0.1:3123
      IPB_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@infrabyx"
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: build
        run: pnpm build
      - name: migrate
        run: node packages/tenancy/dist/migrate/cli.js --db "$DB_URL"
      - name: seed (test profile; the platform and public-site modules)
        working-directory: apps/public
        env:
          SEED_ENABLED: "true"
          SEED_RANDOM_SEED: "1"
          SEED_VAULT_PREFIX: test
          # Written outside the workspace and never uploaded (SEED_CREDENTIALS.md is never committed).
          SEED_CREDENTIALS_PATH: ${{ runner.temp }}/seed-credentials.md
        run: node ../../packages/seed/dist/cli.js --profile test --modules src/seed/public-site.ts
      - name: gate inputs (footer of every published pack, served routes)
        working-directory: apps/public
        run: node scripts/gate-inputs.ts "$RUNNER_TEMP/gate"
      - name: validate-footer (IPB-04-71, @IPB-04-AT-73)
        run: node packages/cms/dist/cli.js validate-footer "$RUNNER_TEMP/gate/footer.json"
      - name: journeys-lint against the served routes (IPB-06-58)
        run: >-
          node packages/a11y/dist/cli.js journeys-lint apps/public/journeys/GRP.yaml
          --routes "$RUNNER_TEMP/gate/routes.json" --at-scripts apps/public/at-scripts
      - name: overlay-scan (IPB-06-17; no accessibility overlay in the build)
        run: >-
          node packages/a11y/dist/cli.js overlay-scan apps/public/.next/static apps/public/src
          apps/console/.next/static apps/console/src
      - name: start the site
        working-directory: apps/public
        run: |
          PORT=3123 nohup pnpm start > "$RUNNER_TEMP/site.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3123/robots.txt && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/site.log"
          exit 1
      - name: e2e and accessibility gate (@IPB-06-AT-01 @IPB-04-AT-70/74/80/81/85 @IPB-04-AT-12/40)
        run: pnpm --filter @infrabyx/public-site test:e2e
      - name: start the Studio console
        working-directory: apps/console
        env:
          APP_BASE_URL: https://studio.example.org
          APP_SITE_URL: https://group.example.org
        run: |
          PORT=3124 nohup pnpm start > "$RUNNER_TEMP/console.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3124/sign-in && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/console.log"
          exit 1
      - name: Studio console gate (every Studio route; the AUTHZ gate; maker-checker through the forms)
        env:
          IPB_TEST_CONSOLE_URL: http://127.0.0.1:3124
        run: pnpm --filter @infrabyx/console test:e2e
      - name: site and console logs
        if: failure()
        run: cat "$RUNNER_TEMP/site.log" "$RUNNER_TEMP/console.log" || true
