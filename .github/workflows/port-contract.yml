name: port-contract
# IPB-01-15 contract legs per port (PL2 plan §3.11, PL2-D-13, PL2-D-44). Pull requests and the nightly
# run cover only the ports whose files changed (nightly: on main in the last 24 hours); the weekly
# run, a manual dispatch and every release run all ports. CI budget: PL2-D-41.
# Sandbox legs join when the GitHub `sandbox` environment exists (PL2-D-12, docs/runbooks/README.md).
on:
  pull_request:
  schedule:
    - cron: "17 21 * * *" # 02:47 IST nightly, changed ports only
    - cron: "47 20 * * 6" # 02:17 IST Sunday, every port
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: port-contract-${{ github.ref }}
  cancel-in-progress: true
env:
  TURBO_TELEMETRY_DISABLED: "1"
  LEFTHOOK: "0"
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      ports: ${{ steps.matrix.outputs.ports }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node scripts/port-matrix.mjs --base "origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "17 21 * * *" ]; then
            node scripts/port-matrix.mjs --since "24 hours ago" >> "$GITHUB_OUTPUT"
          else
            node scripts/port-matrix.mjs --all >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
  contract:
    needs: plan
    if: needs.plan.outputs.ports != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON(needs.plan.outputs.ports) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@infrabyx"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - run: pnpm build --filter @infrabyx/connectors...
      # MinIO-server leg (PL2-D-61): MinIO's last community release, built from source at a
      # pinned commit (no pinnable image exists any more) and kept in the Actions cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: minio-cache
        if: matrix.port == 'STORAGE'
        with:
          path: ~/.cache/ipb-minio
          key: ipb-minio-RELEASE.2025-09-07T16-13-09Z-07c3a429bfed433e49018cb0f78a52145d4bedeb
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.port == 'STORAGE' && steps.minio-cache.outputs.cache-hit != 'true'
        with:
          go-version: "1.24"
          cache: false
      - name: MinIO server (STORAGE)
        if: matrix.port == 'STORAGE'
        run: bash scripts/ci/minio-server.sh
      - name: contract legs (unit + hermetic)
        env:
          PORT: ${{ matrix.port }}
        run: pnpm --filter @infrabyx/connectors test:contract -- --port "$PORT"
