name: release
# Publishes @infrabyx/* to GitHub Packages from main only (IPB-09, CLAUDE.md).
on:
  push:
    branches: [main]
permissions:
  contents: write
  packages: write
  pull-requests: write
  # Keyless signing (cosign, GitHub OIDC): the release job's identity signs the BOM and the
  # package attestations (owner answer #67(1), PL6-D-16).
  id-token: write
concurrency: release-${{ github.ref }}
env:
  TURBO_TELEMETRY_DISABLED: "1"
  # Git hooks are a local guard (PL1-D-17); CI enforces the same checks as steps.
  LEFTHOOK: "0"
jobs:
  detect:
    # A push with no pending changesets is the merge of the version PR, i.e. a publish.
    runs-on: ubuntu-24.04
    outputs:
      publishing: ${{ steps.d.outputs.publishing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -v README.md | grep -q .; then
            echo "publishing=false" >> "$GITHUB_OUTPUT"
          else
            echo "publishing=true" >> "$GITHUB_OUTPUT"
          fi
  contracts:
    # Full port-contract matrix before each release (PL2-D-13).
    needs: detect
    if: needs.detect.outputs.publishing == 'true'
    uses: ./.github/workflows/port-contract.yml
    secrets: inherit
  release:
    needs: [detect, contracts]
    if: ${{ always() && needs.detect.result == 'success' && (needs.contracts.result == 'success' || needs.contracts.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Pushes made with GITHUB_TOKEN do not trigger workflows, so the version branch is pushed
          # with the publish token and its PR runs CI (PL1-D-21). A dedicated GitHub App token
          # replaces this before production (IPB-02-08 least privilege).
          token: ${{ secrets.NPM_PUBLISH_TOKEN }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@infrabyx"
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      - name: Build
        run: pnpm build
      # IPB-01-38, @IPB-01-AT-17: a release refuses an exit runbook older than 180 days.
      - name: Exit runbook currency
        run: pnpm exit-runbook --max-age-days 180
      # IPB-01-40, @IPB-01-AT-18: the reference BOM as valid CycloneDX 1.6, signed below when this run
      # publishes.
      - name: BOM (CycloneDX 1.6)
        run: |
          node scripts/bom.mjs --release "${GITHUB_SHA::12}" --out "$RUNNER_TEMP/bom.cdx.json"
          node -e 'const b = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const v = (r) => b.components.find((c) => c["bom-ref"].startsWith(r))?.version;
            console.log(`BOM ${b.serialNumber}: ${b.components.length} components; node ${v("runtime:node@")}, PostgreSQL ${v("database:postgresql@")}`);' \
            "$RUNNER_TEMP/bom.cdx.json" >> "$GITHUB_STEP_SUMMARY"
      # cosign from the Go module proxy, checked by Go's checksum database like the infra tools
      # (scripts/ci/infra-tools.sh); v3.1.4 was published at least 7 days before it was pinned.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.detect.outputs.publishing == 'true'
        with:
          go-version: "1.24"
          cache: false
      - name: cosign
        if: needs.detect.outputs.publishing == 'true'
        env:
          GOTOOLCHAIN: auto
          GOFLAGS: -trimpath
          CGO_ENABLED: "0"
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/sigstore/cosign/v3/cmd/cosign@v3.1.4
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # IPB-02-35, @IPB-01-AT-18: sign the BOM keyless before anything is published, and verify the
      # signature against this workflow's identity, so a release never ships an unsigned BOM.
      - name: Sign the BOM (cosign keyless)
        if: needs.detect.outputs.publishing == 'true'
        run: |
          ID="https://github.com/${GITHUB_WORKFLOW_REF}"
          cd "$RUNNER_TEMP"
          cosign sign-blob --yes --bundle bom.cdx.json.sigstore.json bom.cdx.json
          cosign verify-blob --bundle bom.cdx.json.sigstore.json --certificate-identity "$ID" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com bom.cdx.json
          echo "BOM signed by $ID (bundle bom.cdx.json.sigstore.json)" >> "$GITHUB_STEP_SUMMARY"
      # Never publish a package a product cannot import (PL3-D-02).
      - name: Consumer smoke (pack, clean install, import every export)
        run: node scripts/consumer-smoke.mjs
      - name: Version and publish (Changesets)
        id: changesets
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          # Opens the version PR as a user, not github-actions, so pull_request CI runs (PL1-D-21).
          GITHUB_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      # The SBOM attestation (IPB-02-35): every published tarball, as the registry serves it, is
      # attested with the BOM as its CycloneDX predicate and verified; the BOM, its signature bundle
      # and the attestation bundle go to the package's GitHub release (docs/product-guide.md §6).
      - name: Attest the published packages (cosign keyless)
        if: steps.changesets.outputs.published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          ID="https://github.com/${GITHUB_WORKFLOW_REF}"
          mkdir -p "$RUNNER_TEMP/attest" && cd "$RUNNER_TEMP/attest"
          for p in $(node -e 'for (const x of JSON.parse(process.env.PUBLISHED)) console.log(`${x.name}@${x.version}`)'); do
            # A version just published can take a moment to be served; try for up to a minute.
            rm -f pack.json
            for i in 1 2 3 4 5 6; do
              npm pack "$p" --registry https://npm.pkg.github.com --json > pack.json && break
              sleep 10
            done
            tgz="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("pack.json", "utf8"))[0].filename)')"
            cosign attest-blob --yes --type cyclonedx --predicate "$RUNNER_TEMP/bom.cdx.json" \
              --bundle "$tgz.cdx.sigstore.json" "$tgz"
            cosign verify-blob-attestation --type cyclonedx --bundle "$tgz.cdx.sigstore.json" \
              --certificate-identity "$ID" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tgz"
            gh release upload "$p" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP/bom.cdx.json" \
              "$RUNNER_TEMP/bom.cdx.json.sigstore.json" "$tgz.cdx.sigstore.json"
            echo "- $p: $tgz attested" >> "$GITHUB_STEP_SUMMARY"
          done
      # Gate evidence (PL2-D-67): the registry's own shasum and integrity for each published version,
      # in the job summary, so a gate report can quote them.
      - name: Registry checksums
        if: steps.changesets.outputs.published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: node scripts/registry-dist.mjs >> "$GITHUB_STEP_SUMMARY"
