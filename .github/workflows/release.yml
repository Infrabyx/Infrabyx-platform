name: release
# Publishes @infrabyx/* to GitHub Packages from main only (IPB-09, CLAUDE.md).
on:
  push:
    branches: [main]
permissions:
  contents: write
  packages: write
  pull-requests: write
concurrency: release-${{ github.ref }}
env:
  TURBO_TELEMETRY_DISABLED: "1"
  # Git hooks are a local guard (PL1-D-17); CI enforces the same checks as steps.
  LEFTHOOK: "0"
jobs:
  detect:
    # A push with no pending changesets is the merge of the version PR, i.e. a publish.
    runs-on: ubuntu-24.04
    outputs:
      publishing: ${{ steps.d.outputs.publishing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -v README.md | grep -q .; then
            echo "publishing=false" >> "$GITHUB_OUTPUT"
          else
            echo "publishing=true" >> "$GITHUB_OUTPUT"
          fi
  contracts:
    # Full port-contract matrix before each release (PL2-D-13).
    needs: detect
    if: needs.detect.outputs.publishing == 'true'
    uses: ./.github/workflows/port-contract.yml
    secrets: inherit
  release:
    needs: [detect, contracts]
    if: ${{ always() && needs.detect.result == 'success' && (needs.contracts.result == 'success' || needs.contracts.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Pushes made with GITHUB_TOKEN do not trigger workflows, so the version branch is pushed
          # with the publish token and its PR runs CI (PL1-D-21). A dedicated GitHub App token
          # replaces this before production (IPB-02-08 least privilege).
          token: ${{ secrets.NPM_PUBLISH_TOKEN }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@infrabyx"
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      - name: Build
        run: pnpm build
      # IPB-01-38, @IPB-01-AT-17: a release refuses an exit runbook older than 180 days.
      - name: Exit runbook currency
        run: pnpm exit-runbook --max-age-days 180
      # IPB-01-40, @IPB-01-AT-18: the reference BOM as valid CycloneDX 1.6. Its cosign signature and
      # its storage with the release record wait for the signing decision (OWNER-QUESTIONS #67).
      - name: BOM (CycloneDX 1.6)
        run: |
          node scripts/bom.mjs --release "${GITHUB_SHA::12}" --out "$RUNNER_TEMP/bom.cdx.json"
          node -e 'const b = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const v = (r) => b.components.find((c) => c["bom-ref"].startsWith(r))?.version;
            console.log(`BOM ${b.serialNumber}: ${b.components.length} components; node ${v("runtime:node@")}, PostgreSQL ${v("database:postgresql@")}`);' \
            "$RUNNER_TEMP/bom.cdx.json" >> "$GITHUB_STEP_SUMMARY"
      # Never publish a package a product cannot import (PL3-D-02).
      - name: Consumer smoke (pack, clean install, import every export)
        run: node scripts/consumer-smoke.mjs
      - name: Version and publish (Changesets)
        id: changesets
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          # Opens the version PR as a user, not github-actions, so pull_request CI runs (PL1-D-21).
          GITHUB_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      # Gate evidence (PL2-D-67): the registry's own shasum and integrity for each published version,
      # in the job summary, so a gate report can quote them.
      - name: Registry checksums
        if: steps.changesets.outputs.published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: node scripts/registry-dist.mjs >> "$GITHUB_STEP_SUMMARY"
