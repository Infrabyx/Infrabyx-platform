# Platform help entries, module `consent` (IPB-07 §07.4.3; PL5 session 7). Plain text of at most 40 words;
# no legal citations, so no reviewer of record is needed (IPB-HLP-003).
module: consent
entries:
  - key: hlp.consent.functional
    term: "Functional cookies"
    plain: "Cookies that remember choices such as language, so the site works the way you set it. They are off unless you allow them."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.consent.analytics
    term: "Analytics cookies"
    plain: "Cookies that count visits and pages used, to improve the site. They are off unless you allow them."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.consent.marketing
    term: "Marketing cookies"
    plain: "Cookies that measure campaigns or show relevant offers. They are off unless you allow them, and never used on sensitive pages."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
