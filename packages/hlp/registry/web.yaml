# Platform help entries, module `web` (IPB-07 §07.4.3; PL5 session 7). Plain text of at most 40 words;
# no legal citations, so no reviewer of record is needed (IPB-HLP-003).
module: web
entries:
  - key: hlp.web.cin
    term: "CIN"
    plain: "The Corporate Identity Number the Registrar of Companies gives every company registered in India."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.gstin
    term: "GSTIN"
    plain: "The Goods and Services Tax Identification Number of a business registered for GST in India."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.grievance_officer
    term: "Grievance Officer"
    plain: "The person who receives and resolves your complaints about our services and how we handle your data."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.dpo
    term: "Data Protection Officer"
    plain: "The person responsible for how we protect personal data and for answering your questions about it."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.cookie_settings
    term: "Cookie settings"
    plain: "Where you choose which optional cookies the site may use. You can change your choice at any time."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.accessibility_statement
    term: "Accessibility statement"
    plain: "What we have done to make this site accessible, what is not yet accessible, and how to report a problem."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.group_company
    term: "Group company"
    plain: "A business that is part of the Infrabyx Group, with its own legal entity."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
