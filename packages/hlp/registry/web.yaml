# Platform help entries, module `web` (IPB-07 §07.4.3; PL5 session 7). Plain text of at most 40 words;
# no legal citations, so no reviewer of record is needed (IPB-HLP-003).
module: web
entries:
  - key: hlp.web.cin
    term: "CIN"
    plain: "The Corporate Identity Number the Registrar of Companies gives every company registered in India."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.gstin
    term: "GSTIN"
    plain: "The Goods and Services Tax Identification Number of a business registered for GST in India."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.grievance_officer
    term: "Grievance Officer"
    plain: "The person who receives and resolves your complaints about our services and how we handle your data."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.dpo
    term: "Data Protection Officer"
    plain: "The person responsible for how we protect personal data and for answering your questions about it."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.cookie_settings
    term: "Cookie settings"
    plain: "Where you choose which optional cookies the site may use. You can change your choice at any time."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.accessibility_statement
    term: "Accessibility statement"
    plain: "What we have done to make this site accessible, what is not yet accessible, and how to report a problem."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.group_company
    term: "Group company"
    plain: "A business that is part of the Infrabyx Group, with its own legal entity."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.field.full_name
    term: "Your name"
    plain: "The name we should use when we reply to you."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.field.email
    term: "Email address"
    plain: "The address we reply to. We use it only for this message."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.field.organisation
    term: "Organisation"
    plain: "The company or team you work with, if your message is about it. You can leave this empty."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.field.message
    term: "Your message"
    plain: "Tell us what you need in your own words. Please do not include passwords, account numbers or other sensitive details."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.field.other
    term: "Form field"
    plain: "Fill this in if it applies to you. Fields marked required must be filled in before you send the form."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.consent_notice
    term: "Consent to contact"
    plain: "Tick this to let us use your details to answer this message. We keep a record of the notice you agreed to."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
  - key: hlp.web.site_search
    term: "Search for a page"
    plain: "Type a word from the page you want, such as careers or privacy, to see matching pages."
    effective_date: 2026-10-27
    review_by: 2027-10-27
    status: published
    visibility: public
