# Settings tree and registry — source of truth (IPB-07-36, PL1-D-02 / D-12).
# `pnpm --filter @infrabyx/config gen:registry` generates src/settings/registry.generated.ts;
# CI fails when the two drift. Keys owned by later phases are registered by those phases (D-11).
#
# Key fields
#   key        dotted key; {param} marks a templated segment (e.g. int.{port}.primary)
#   tier       lowest tier at which the key may be set: PLATFORM | PLAN | BRAND | TENANT | ENTITY | USER
#              (ORG in IPB tables = TENANT, or ENTITY with scope legal_entity; IPB-07 §07.5 note)
#   type       bool | int | decimal | string | enum | string[] | enum[] | cidr[] | json | locale | route | time | range | date
#   default    value used when no tier sets one
#   min / max  hard bounds (floors and ceilings; a lower tier can never cross them)
#   locked     true: nobody may change the value at any tier (IPB-02-86, IPB-SEC-020)
#   tighten    a lower tier may only make the value stricter: min (higher is stricter), max (lower is
#              stricter), superset (lists may only grow), true / false (the strict boolean value)
#   user_override  USER may set a TENANT/ENTITY key
#   change     roles that may change it; "self" = the user the value belongs to; "pipeline" = deploy only
#   mc         maker-checker risk class (R2 | R4 | R5) or false
#   help       help key (IPB-07-42)
#   source     IPB section that defines the key

version: "1.0"

